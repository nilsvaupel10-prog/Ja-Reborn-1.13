name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      variant: { description: 'APK variant', default: debug, type: choice, options: [debug, release] }
permissions:
  contents: read
concurrency: { group: apk, cancel-in-progress: false }
jobs:
  apk:
    if: github.repository == 'nilsvaupel10-prog/Ja-Reborn-1.13'   # forks must not inherit this build
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: dtolnay/rust-toolchain@1.85.1
      - run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
      - name: Release signing (only when the secrets exist)
        if: ${{ inputs.variant == 'release' && env.RELEASE_KEYSTORE_BASE64 != '' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          base64 -d <<< "$RELEASE_KEYSTORE_BASE64" > "$RUNNER_TEMP/release.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$RUNNER_TEMP/release.jks" "$RELEASE_KEYSTORE_PASSWORD" "$RELEASE_KEY_ALIAS" "$RELEASE_KEY_PASSWORD" \
            > android/release-keystore.properties
      - name: Gradle build
        working-directory: android
        run: ./gradlew --no-daemon ":app:assemble${{ inputs.variant == 'release' && 'Release' || 'Debug' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ja2-reborn-apk
          path: android/app/build/outputs/apk/${{ inputs.variant }}/*.apk
          if-no-files-found: error
