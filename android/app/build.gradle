apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlinx-serialization'

android {
    namespace 'com.ja2.reborn'
    compileSdk 35

    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "com.ja2.reborn"
        minSdk 24
        targetSdk 35

        String version = file('../../version').text.trim()
        logger.info('JA2 Reborn Version Name: "{}".', version)
        Integer versionCodeFromVersion = version.split('\\.').collect({ it.padLeft(3, '0') }).join('').toInteger()
        logger.info('JA2 Reborn Version Code: "{}".', versionCodeFromVersion)

        versionName version
        versionCode versionCodeFromVersion

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared',
                          '-DCMAKE_CXX_STANDARD=20',
                          '-DBUILD_SDL_LIB=ON',
                          '-DBUILD_LAUNCHER=OFF',
                          '-DWITH_UNITTESTS=OFF',
                          '-DWITH_RUST_BINARIES=OFF',
                          '-DCMAKE_CXX_FLAGS=-fPIC',
                          '-DCMAKE_C_FLAGS=-fPIC'
            }
        }

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    buildFeatures {
        viewBinding true
    }

    signingConfigs {
        def releaseKeystorePropertiesFile = rootProject.file('release-keystore.properties')
        if (releaseKeystorePropertiesFile.exists()) {
            def releaseKeystoreProperties = new Properties()
            releaseKeystoreProperties.load(new FileInputStream(releaseKeystorePropertiesFile))

            release {
                storeFile rootProject.file(releaseKeystoreProperties.getProperty('storeFile'))
                storePassword releaseKeystoreProperties.getProperty('storePassword')
                keyAlias releaseKeystoreProperties.getProperty('keyAlias')
                keyPassword releaseKeystoreProperties.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.findByName('release')
        }
    }

    externalNativeBuild {
        cmake {
            path "../../CMakeLists.txt"
        }
    }

    sourceSets {
        main {
            assets {
                srcDirs = [ "../../assets" ]
            }
        }
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            // The launcher helpers log through android.util.Log, which has no implementation in
            // plain JVM unit tests.
            returnDefaultValues = true
        }
    }

    lint {
        // no suppressions — all issues are addressed
    }
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3"
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.activity:activity-ktx:1.10.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.7'
    implementation 'androidx.window:window:1.3.0'
    implementation 'com.caverock:androidsvg-aar:1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}

tasks.register("projectVersion") {
    doLast {
        println(android.defaultConfig.versionName)
    }
}
